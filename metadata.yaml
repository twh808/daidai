name: 呆呆面板管理
desc: 通过QQ机器人管理呆呆面板
author: 一休哥
version: "1.2.0"
repo: https://github.com/twh808/daidai/tree/master
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16,<5"
config:
  - name: base_url
    desc: 呆呆面板API地址
    default: "http://127.0.0.1:5700/api/v1"
  - name: app_key
    desc: 呆呆面板的AppKey
    default: ""
  - name: app_secret
    desc: 呆呆面板的AppSecret
    default: ""
  - name: admin_qq
    desc: 管理员QQ号，多个用英文逗号分隔
    default: ""
