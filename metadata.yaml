name: 呆呆面板管理
desc: 通过QQ机器人管理呆呆面板
author: 一休哥
version: "1.2.0"
repo: https://github.com/twh808/daidai/tree/master
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16,<5"
config:
  - name: 呆呆面板API地址
    type: string
    default: http://127.0.0.1:5700/api/v1
    description: 例如：http://127.0.0.1:5700/api/v1
  - name: 呆呆面板的AppKey
    type: string
    default: ""
    description: 在呆呆面板后台 -> 系统设置 -> OpenAPI 中获取
  - name: 呆呆面板的AppSecret
    type: string
    default: ""
    description: 在呆呆面板后台 -> 系统设置 -> OpenAPI 中获取
  - name: 管理员QQ号
    type: string
    default: ""
    description: 多个用英文逗号分隔（例如：123456789,987654321），留空则允许所有人使用命令
